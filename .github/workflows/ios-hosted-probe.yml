name: iOS hosted runner probe

# A one-off trial: does GitHub's Xcode 27 image carry what the iOS gate
# needs? Lives only on the ios-hosted-probe branch and is never merged.
on:
  push:
    branches: [ios-hosted-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Machine
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          df -h / | tail -1
      - name: Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true
      - name: Simulator runtimes before
        run: xcrun simctl list runtimes
      - name: Fetch the iOS 26.5 runtime if missing, timed
        run: |
          if xcrun simctl list runtimes | grep -q "iOS 26.5 "; then
            echo "iOS 26.5 already installed"
          else
            start=$(date +%s)
            xcodebuild -downloadPlatform iOS -buildVersion 26.5 || echo "download by build version failed"
            echo "download took $(( $(date +%s) - start ))s"
          fi
          xcrun simctl list runtimes
