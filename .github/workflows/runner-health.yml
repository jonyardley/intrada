name: Runner health

# The self-hosted Mac once failed every draft for days on its own faults, a
# full disk and then an Xcode the gate did not expect, and each failure read as
# a red pull request (#2876). This runs the gate's own first check hourly and
# keeps one issue labelled runner-broken open while it fails, closed once it
# passes. No assignee and no mentions: the issue is the only signal.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check the self-hosted Mac
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    # A runner that is away leaves hourly checks queued; one queued check is
    # enough. On the job, not the workflow, so the stale job below still runs.
    concurrency:
      group: runner-health-check
    outputs:
      broken: ${{ steps.health.outputs.broken }}
    # Allow-listed, as in ci.yml: a trigger added here later has to be named
    # before it can reach the machine.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      # The gate's workspace is shared and warm, so only the script and the
      # pins it reads are fetched, into a folder the gate's `git clean -ffd`
      # drops, and nothing is cleaned.
      - uses: actions/checkout@v7
        with:
          path: .runner-health
          clean: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/runner-health.sh
            .github/workflows/ci.yml
      # Only the script's own verdict files the issue; a GitHub-side blip
      # fails the job without it, and the stale job catches a lasting one.
      - name: Check disk, Xcode and iOS runtime
        id: health
        run: bash .runner-health/scripts/runner-health.sh || { echo "broken=true" >>"$GITHUB_OUTPUT"; exit 1; }

  # On GitHub's own runner, so the issues token never reaches the Mac. A
  # cancelled or skipped check, or one that failed before the script ran,
  # changes nothing here.
  report:
    name: Open or close the runner-broken issue
    runs-on: ubuntu-latest
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.outputs.broken == 'true')
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.check.result }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # GitHub's runner, not the Mac; only the deciding script is fetched.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/runner-alarm.sh
      - name: Update the issue
        run: |
          set -euo pipefail
          open="$(gh issue list --label runner-broken --state open --json number --jq '.[0].number // empty')"
          if [ "$RESULT" = success ]; then
            [ -z "$open" ] || gh issue close "$open" --comment "Passing again: $RUN_URL"
            exit 0
          fi
          body="The self-hosted Mac failed its health check at $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL

          The run's annotations say what is wrong. Fix: prune the runner (the Runner housekeeping workflow, or free space by hand), or set the repository variable IOS_RUNNER to hosted to move the gate to GitHub's Mac. This issue closes itself on the first passing hourly run."
          if [ -n "$open" ]; then
            gh issue edit "$open" --body "$body"
            exit 0
          fi
          # One failed check is often a blip; raise only when the run before
          # this one did not pass either (#2916).
          verdict="$(gh run list --workflow runner-health.yml --limit 30 --json databaseId,status,conclusion,createdAt | bash scripts/runner-alarm.sh failed "$RUN_ID")"
          echo "$verdict"
          [ "${verdict%%:*}" = raise ] || exit 0
          gh issue create --title "Mac runner broken, not your code" --label runner-broken --body "$body"

  # A Mac that is offline, or too full to check out, never reaches the script,
  # so its checks sit queued or fail silently. Without needing the check, this
  # opens the issue once no run has passed for three hours and the two runs
  # before this one did not pass either (#2916). It never closes it: the
  # report job does, on the first passing check.
  stale:
    name: Open the issue when no check has passed for three hours
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/runner-alarm.sh
      - name: Check the last passing run
        run: |
          set -euo pipefail
          [ -z "$(gh issue list --label runner-broken --state open --json number --jq '.[0].number // empty')" ] || exit 0
          runs="$(gh run list --workflow runner-health.yml --limit 30 --json databaseId,status,conclusion,createdAt)"
          verdict="$(bash scripts/runner-alarm.sh stale "$RUN_ID" <<<"$runs")"
          echo "$verdict"
          [ "${verdict%%:*}" = raise ] || exit 0
          last="$(jq -r --argjson id "$RUN_ID" '[.[] | select(.databaseId < $id and .conclusion == "success")] | max_by(.databaseId) | .createdAt // "before the last 30 runs"' <<<"$runs")"
          gh issue create --title "Mac runner broken, not your code" --label runner-broken --body "The self-hosted Mac has not passed its hourly health check since $last: $RUN_URL

          It is offline, busy for hours, or too full to check out. Fix: start or prune the runner (the Runner housekeeping workflow, or free space by hand), or set the repository variable IOS_RUNNER to hosted to move the gate to GitHub's Mac. This issue closes itself on the first passing hourly run."
