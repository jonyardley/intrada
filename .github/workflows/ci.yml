name: CI

on:
  push:
    branches: [main]
  # Run on every PR regardless of target branch — stacked PRs (where the
  # target is a feature branch, not main) need CI too. Without this filter
  # the workflow only triggers when the target is `main`, leaving stacked
  # PRs with "no checks reported" until they're rebased onto main.
  pull_request:
    # Explicit types, adding labeled/unlabeled to the default set (opened,
    # synchronize, reopened): the comments-justified bypass (#1433) needs a
    # label change to start a fresh run, since re-running an old one replays
    # the pre-label payload and fails again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Cancel in-flight runs when a new commit lands on the same PR. Don't cancel
# main-branch runs: those need to run to completion so a red main is visible
# and `alert-on-red-main` fires.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  RUST_VERSION: "1.97.1"
  SENTRY_ORG: jon-yardley
  # Asserted by the self-hosted gate, which runs on a machine that updates
  # itself (#1637).
  SELFHOSTED_XCODE: "27.0"

jobs:
  # Detects which paths changed: against the base branch on a PR, against the
  # commit before the push on main. The Rust jobs still run on every main push,
  # since Codecov compares a PR with its base commit's report; the Mac gate
  # follows `native` on both (#2113). Runs cheaply (~5s) on every event.
  changes:
    name: Path Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - '.github/workflows/ci.yml'
            native:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/intrada-core/**'
              - 'crates/intrada-ffi/**'
              - 'ios/**'
              - 'scripts/ios-run-sim.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
      # A filter that wrongly saw nothing would skip main's Mac gate in
      # silence, so each run says what it saw (#2113).
      - name: Say what the filter saw
        env:
          RUST: ${{ steps.filter.outputs.rust }}
          NATIVE: ${{ steps.filter.outputs.native }}
        run: echo "Path filter on ${GITHUB_EVENT_NAME}: rust=${RUST} native=${NATIVE}" >> "$GITHUB_STEP_SUMMARY"
      # Drift installs clippy/rustfmt for the env's version, then cargo resolves
      # to the file's: "clippy is not installed", or a silent second download.
      # Checks every workflow's RUST_VERSION, not just this file's — so a
      # third lane (or release-testflight.yml's own copy) is covered by
      # construction rather than by remembering to hand-edit it too (#1341).
      - name: Toolchain pins agree
        run: |
          pinned=$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          for wf in .github/workflows/*.yml; do
            version=$(grep -oE '^[[:space:]]*RUST_VERSION: "[^"]+"' "$wf" | grep -oE '"[^"]+"' | tr -d '"')
            if [ -n "$version" ] && [ "$version" != "$pinned" ]; then
              echo "$wf pins RUST_VERSION $version but rust-toolchain.toml pins $pinned"
              exit 1
            fi
          done
      # cargo-swift's bundled uniffi-bindgen must match our uniffi runtime
      # contract exactly, so its pin must agree between mise.toml and the
      # release lane: a bump to one and not the other silently installs a
      # mismatched cargo-swift/uniffi-bindgen pair (the #846 class CLAUDE.md
      # warns about). The release lane's xcodegen must stay one exact release
      # rather than an unpinned `brew install xcodegen` (#1556). Each half
      # fails loudly when its pin is missing, so a reworded cache key cannot
      # turn the guard into a green no-op.
      - name: Version pins agree (cargo-swift, xcodegen and sentry-cli across files)
        run: |
          swift_pinned=$(grep -oE '"cargo:cargo-swift" = "[^"]+"' mise.toml | cut -d'"' -f4)
          if [ -z "$swift_pinned" ]; then
            echo "no cargo-swift pin in mise.toml: the guard would be a no-op"
            exit 1
          fi
          swift_seen=0
          while read -r v; do
            swift_seen=$((swift_seen + 1))
            if [ "$v" != "$swift_pinned" ]; then
              echo "release-testflight.yml pins cargo-swift $v but mise.toml pins $swift_pinned"
              exit 1
            fi
          done < <(grep -oE 'cargo-swift.*[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/release-testflight.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$swift_seen" -eq 0 ]; then
            echo "no cargo-swift version in release-testflight.yml: the guard would be a no-op"
            exit 1
          fi
          # The install-URL form only: the cache key alone would still carry
          # a stale version if the pinned download step were ever reverted to
          # a bare brew install while its cache step stayed behind, silently
          # turning this half of the guard into a no-op (#1556).
          xcodegen_release_pins=$(grep -ohE 'download/[0-9]+\.[0-9]+\.[0-9]+/xcodegen' \
            .github/workflows/release-testflight.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ -z "$xcodegen_release_pins" ]; then
            echo "no xcodegen pin in release-testflight.yml: the guard would be a no-op"
            exit 1
          fi
          xcodegen_key_pins=$(grep -ohE 'xcodegen-[0-9]+\.[0-9]+\.[0-9]+' \
            .github/workflows/release-testflight.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ "$xcodegen_key_pins" != "$xcodegen_release_pins" ]; then
            echo "release-testflight.yml installs xcodegen $xcodegen_release_pins but caches it as $xcodegen_key_pins"
            exit 1
          fi
          # sentry-cli lives in the download URL alone: mise.toml does not carry
          # it, since nothing local runs it. So "agree" here is one exact version
          # across the workflows, which fails loudly if the URL ever drifts back
          # to a floating one and the lane starts taking whatever the CDN serves
          # (#1611).
          sentry_pins=$(grep -ohE 'sentry-cli/[0-9]+\.[0-9]+\.[0-9]+' \
            .github/workflows/*.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u || true)
          if [ -z "$sentry_pins" ]; then
            echo "no exact sentry-cli version in any workflow: the release lane would install whatever the CDN serves"
            exit 1
          fi
          if [ "$(printf '%s\n' "$sentry_pins" | wc -l)" -gt 1 ]; then
            echo "sentry-cli pins disagree across the workflows: $sentry_pins"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Runs on push to main as well as on PRs, and it has to: a PR comment is a
    # comparison, so with no report on the base commit there is nothing to
    # compare and Codecov posts nothing. `main` had never uploaded once, which
    # is why the dashboard was empty and no PR had been commented on (#1288).
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "native"
          cache-on-failure: true
      # nextest runs the same assertions as `cargo test` but with a smarter
      # scheduler: typically 40 to 50% faster.
      - uses: taiki-e/install-action@v2.87.14
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # One instrumented run emits both the junit XML dorny/test-reporter
      # reads and the Codecov upload, so the workspace builds once per run
      # instead of twice (#1517: measured 1.64x instrumented-vs-plain
      # locally, under the 2x this was worth folding at).
      - name: Generate coverage
        run: >
          cargo llvm-cov nextest
          --workspace
          --profile ci
          --codecov
          --output-path codecov.json
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      # Read the floor from Cargo.toml rather than pinning it again here: the
      # toolchain we build with is seven minors above it, so nothing else fails.
      - id: floor
        run: |
          version=$(grep -oE 'package.rust-version = "[^"]+"' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "msrv"
          cache-on-failure: true
      # `+toolchain` beats rust-toolchain.toml, which would otherwise pull the
      # current pin straight back in.
      - run: cargo +${{ steps.floor.outputs.version }} check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      # rust-cache's key is `<prefix-key>-<job>-…`, so `native` here asked for
      # `native-clippy-…`, which nothing writes: this job restored nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.14
        with:
          tool: clippy-sarif,sarif-fmt
      # Run clippy with JSON output piped through clippy-sarif for GitHub
      # code scanning annotations, then check the exit code to fail the job.
      # --all-targets so test/bench code is linted too, not just lib/bin — a
      # dropped `#[must_use]` Command shipped in a test once because the gate
      # stopped at lib targets.
      - name: Clippy (native)
        shell: bash
        run: |
          set +o pipefail
          cargo clippy --workspace --all-targets \
            --message-format=json -- -D warnings 2>&1 \
            | clippy-sarif | tee clippy-native.sarif | sarif-fmt
          exit "${PIPESTATUS[0]}"
      - name: Upload Clippy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy-native.sarif
          category: clippy-native
          wait-for-processing: true

  # The whole iOS gate in one job on a self-hosted Mac (#1577).
  native-ios-selfhosted:
    name: "Native iOS: self-hosted gate"
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    needs: changes
    # Allow-listed rather than deny-listed: a trigger added to this workflow
    # later has to be named here before it can reach the machine. Fork pull
    # requests are not supported (#1962) and never reach it; the repo's
    # "require approval for all external contributors" setting is the second
    # line, not the first. A push to main whose native paths did not change
    # skips it too: a docs-only merge ran the full gate for nothing (#2113).
    if: >-
      needs.changes.outputs.native == 'true'
      && (github.event_name == 'push'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
    steps:
      # `clean: true` would take `target/`, `ios/build` and `ios/generated`
      # with it, which is the warm state this machine exists for.
      # `persist-credentials: false` keeps the token out of a `.git/config`
      # that outlives the job.
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      # `_ios-inputs-fingerprint` hashes untracked filenames under `ios/`, so
      # one stray file makes the test step refuse. No `-x`: the ignored warm
      # caches survive, the strays do not.
      - name: Drop untracked strays, keep the warm caches
        run: git clean -ffd
      # The main-only smoke below boots an iPhone by name and leaves it
      # running, which cost nothing on a rented runner destroyed afterwards.
      # On a single-tenant runner a device booted at job start is always left
      # over from an earlier run, so each one is shut down by udid. Not an
      # erase, and not a reset: a local simulator would be taken too, which is
      # why the machine is documented as doing no local iOS work.
      - name: Shut down simulators left from earlier runs
        run: |
          set -euo pipefail
          xcrun simctl list devices --json \
            | python3 -c "import json,sys; [print(d['udid']) for v in json.load(sys.stdin)['devices'].values() for d in v if d['state']=='Booted']" \
            | while read -r udid; do
                echo "shutting down stale simulator $udid"
                xcrun simctl shutdown "$udid" || true
              done
      # Snapshot pixels come from the iOS runtime and `swift format` defaults
      # ship inside Xcode, so a Software Update on this machine could move the
      # gate with no code change. Both are asserted rather than assumed.
      - name: Assert the pinned toolchain
        run: |
          have="$(xcodebuild -version | head -1)"
          if [ "$have" != "Xcode $SELFHOSTED_XCODE" ]; then
            echo "runner is on $have, this gate expects Xcode $SELFHOSTED_XCODE (#1637)" >&2
            exit 1
          fi
          if ! xcrun simctl list runtimes | grep -q "iOS 26.5 "; then
            echo "the iOS 26.5 simulator runtime the snapshot references pin is missing" >&2
            exit 1
          fi
      # The same tree on the same Xcode and runtime gives the same answer, and
      # most merges land exactly the tree their PR tested, so a tree already
      # green here skips the three test steps below (#2113). The build stays:
      # main's launch check reuses this tree's app. A re-run attempt always
      # runs in full.
      - name: Look up an earlier green run of this tree
        id: proven
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          toolchain="$( { xcodebuild -version; xcrun simctl list runtimes | grep "iOS 26.5 "; } | shasum -a 256 | cut -c1-16)"
          record="$HOME/.intrada-ci/green-trees/$tree-$toolchain"
          echo "record=$record" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ] && [ -f "$record" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Tree $tree already passed the unit and UI tests in $(cat "$record"), so they are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Through GITHUB_ENV because the `env` context is illegal in a job-level
      # `env:`, where it resolves to empty instead of failing.
      - name: Pin the Rust toolchain for this job
        run: echo "RUSTUP_TOOLCHAIN=${{ env.RUST_VERSION }}" >> "$GITHUB_ENV"
      - name: swift format check
        run: just ios-fmt-check
      - name: Clippy (iOS device target)
        run: cargo clippy -p intrada-ffi --target aarch64-apple-ios -- -D warnings
      - name: Regenerate Swift bindings (facet typegen + cargo-swift)
        run: just ios-gen
      # `_ios-test-without-building` reports its counts from the newest
      # `.xcresult`, treating one that exists as one this run wrote. That held
      # only because every rented job started empty.
      - name: Drop earlier result bundles
        run: rm -rf ios/build/dd/Logs/Test
      - name: Build for testing (just _ios-build-for-testing)
        run: just _ios-build-for-testing
      # The device outlives the run, so the app's UserDefaults would too, and
      # SessionRecoveryUITests asserts a resume prompt that a leftover
      # crash-recovery blob satisfies on its own. Scoped to this one device,
      # never a global reset. `simctl uninstall` needs a booted device and the
      # shutdown at job start leaves this one off, so without the boot the
      # step is a silent no-op.
      - name: Clear the app's saved state from the test device
        if: steps.proven.outputs.hit != 'true'
        run: |
          udid="$(just _ios-test-sim-udid)"
          if [ -n "$udid" ]; then
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl uninstall "$udid" com.intrada.native || true
          fi
      - name: Test (unit + snapshot)
        if: steps.proven.outputs.hit != 'true'
        run: just _ios-test-without-building -only-testing:IntradaTests 0
      # A skip, not an only, so a test target added later joins this step
      # instead of running nowhere (#1456). The third argument is the
      # justfile's `parallel` flag, back on now that the rename test clears
      # the field with delete keys instead of waiting on a Select All menu
      # (#1642).
      - name: Test (UI)
        if: steps.proven.outputs.hit != 'true'
        run: just _ios-test-without-building -skip-testing:IntradaTests 1 1
      - name: Record this tree as green
        if: steps.proven.outputs.hit != 'true'
        env:
          RECORD: ${{ steps.proven.outputs.record }}
        run: |
          mkdir -p "$(dirname "$RECORD")"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RECORD"
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: ios/IntradaTests/__Snapshots__/
          retention-days: 7
          if-no-files-found: ignore
      # A non-snapshot failure leaves nothing to read otherwise: the test step
      # prints counts and the failing test's name, never its message (#1576).
      # The only other copy is on the machine, where housekeeping deletes it.
      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-selfhosted-xcresult
          path: ios/build/dd/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
      # Main only: the `#if DEBUG` divergence check has caught one break ever
      # (#1177), across nine measured runs, all green, at 32-153s a run
      # against a 339s median gate. Paying that on every pull request was the
      # wrong trade (#1651); a Release-only break now lands on main and gets
      # a follow-up PR instead.
      - name: Build Release (just ios-build-release)
        if: github.event_name == 'push'
        run: just ios-build-release
      # Main only, and last: "does the real app boot through its FFI entry
      # point", plus the visual artefact. After the tests so the launch cannot
      # leave state on the device they read.
      - name: Launch on simulator + screenshot
        if: github.event_name == 'push'
        run: REUSE_BUILD=1 bash scripts/ios-run-sim.sh "$GITHUB_WORKSPACE/ios-screenshots/native.png"
      - name: Upload screenshot
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-screenshot
          path: ios-screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # Branch protection's required status check is this job's `name:`, so the
  # gate itself can move machines without a required-checks change on GitHub
  # (#1207, #1577). Fork pull requests are not supported (#1962): the
  # self-hosted job skips them, so they fail here rather than pass unchecked.
  native-ios:
    name: Native iOS (build + test)
    runs-on: ubuntu-latest
    needs: [changes, native-ios-selfhosted]
    if: always() && needs.changes.outputs.native == 'true'
    steps:
      - name: Check the self-hosted gate
        run: |
          self="${{ needs.native-ios-selfhosted.result }}"
          if [ "$self" != "success" ]; then
            echo "✗ the self-hosted iOS gate did not succeed (result: $self); it never runs for a fork pull request (#1962)" >&2
            exit 1
          fi

  # Cheap (<5s, no macOS) guard that keeps the snapshot-reference suite from
  # bloating git history: every PNG must map to a current test (no orphans) and
  # stay under the size ceiling (catches un-optimized references — Xcode writes a
  # redundant alpha channel; `just ios-snapshots-optimize` strips it). See
  # .claude/rules/ios-quality.md.
  snapshot-hygiene:
    name: Snapshot Hygiene
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check snapshot references (orphans + size ceiling)
        run: bash scripts/check-snapshots.sh

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The same comment-density gate as the local pre-push hook, enforced for
  # everyone: an opt-in hook is effectively off (.claude/rules/ios-quality.md "stated invariant =
  # enforced invariant"). HEAD is detached on a PR checkout, so the base branch
  # is passed explicitly via COMMENT_CHECK_BASE. CI can't see the local
  # SKIP_COMMENT_CHECK env var, so a genuinely justified case bypasses here
  # via the comments-justified PR label instead (#1433).
  comment-density:
    name: Comment density
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'comments-justified')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check comment density
        env:
          COMMENT_CHECK_BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          bash scripts/check-comment-density.sh

  # The same diff-scoped enforcement as the local pre-push hook, on for
  # everyone, since an opt-in hook is effectively off. HEAD is detached on a PR
  # checkout, so the base is passed explicitly via DASH_CHECK_BASE.
  dash-check:
    name: No em or en dashes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for added dashes and American spellings
        env:
          DASH_CHECK_BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          bash scripts/check-dashes.sh

  security:
    # The name is load-bearing: branch protection matches required checks on
    # this exact string, so renaming it orphans the required check and the PR
    # waits forever on a job that will never report again. actionlint runs here
    # too, deliberately unnamed.
    name: Security & hygiene (cargo-deny, Gitleaks, typos, cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned: typos dictionary updates can start flagging previously-clean
      # words, failing unrelated PRs. Bump deliberately, with mise.toml.
      - uses: taiki-e/install-action@v2.87.14
        with:
          tool: typos@1.48,cargo-shear@1.13
      # actionlint is a Go binary, not a crate: install-action carries no entry
      # for it and its cargo-binstall fallback reports "actionlint is not
      # found". Fetch the pinned release directly; keep the version in lockstep
      # with mise.toml.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # ── typos ──────────────────────────────────────────────────────────
      # Source-tree spell check (docs-heavy repo; also catches identifier
      # typos clippy/swift-format never will). Project words: _typos.toml.
      # Runs BEFORE gitleaks: that action writes results.sarif into the
      # workspace and typos would flag words inside the generated file.
      - name: Spell check (typos)
        run: typos
      # ── cargo-shear ────────────────────────────────────────────────────
      # Unused workspace dependencies — catches dead deps that inflate CI builds.
      - name: Unused dependencies (cargo-shear)
        run: cargo-shear
      # ── actionlint ─────────────────────────────────────────────────────
      # A workflow's first real exercise is the event that triggers it, so a
      # schema or expression error otherwise surfaces on the merge that needed
      # it to work. Keep the pin in lockstep with mise.toml.
      - name: Workflow lint (actionlint)
        run: actionlint
      # ── markdown links ─────────────────────────────────────────────────
      # Links added on changed lines are diff-scoped like the dash check, so
      # they bind without a clean sweep of every historical link first; a file
      # the branch removes is checked against the whole tree. HEAD is detached
      # on a PR checkout, so the base is passed explicitly; on a push to main
      # the script sees the branch name and exits clean (#1597).
      - name: Documentation links
        env:
          LINK_CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "${LINK_CHECK_BASE}" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
          fi
          bash scripts/check-links.sh
      # ── Sentry release name ────────────────────────────────────────────
      # The app and the release lane compose the same name from the same three
      # Info.plist fields, and nothing else reads the two together (#1611).
      - name: Release name agrees across the app and the release lane
        run: bash scripts/check-release-name.sh
      # ── app version ────────────────────────────────────────────────────
      # A hand-dispatched build takes its version from ios/project.yml, so one
      # behind the newest tag files crashes under a release nobody cut (#1961).
      - name: App version is not behind the newest release tag
        run: bash scripts/check-app-version.sh
      # ── faint ink ──────────────────────────────────────────────────────
      # inkFaint fails AA on text and a snapshot cannot see contrast, so the
      # token is kept to the section eyebrow (#1941).
      - name: Faint ink stays on eyebrows
        run: bash scripts/check-faint-ink.sh
      # ── the gates above, proven against broken input ────────────────────
      - name: Hygiene checks still bite
        run: bash scripts/tests/hygiene-checks-test.sh
      # ── pr-visuals ───────────────────────────────────────────────────────
      # Proves scripts/pr-visuals.sh still classifies a modified, an added and
      # a deleted snapshot reference correctly (#1631).
      - name: pr-visuals still classifies each shape correctly
        run: bash scripts/tests/pr-visuals-test.sh
      # ── iOS simulator lock ───────────────────────────────────────────────
      # A crashed holder's lock must read as free, or the idle shutdown timer
      # keeps a sim booted until the next run clears it (#1885).
      - name: The simulator lock still tells a live holder from a crashed one
        run: bash scripts/tests/ios-sim-lock-test.sh
      # ── cmux gate signal ─────────────────────────────────────────────────
      - name: A gate's cmux signal never changes its verdict
        run: bash scripts/tests/cmux-gate-test.sh
      # ── audit sweep ──────────────────────────────────────────────────────
      # A probe that stops matching reads as an improvement in the next audit
      # rather than as a broken probe (#2092).
      - name: The audit sweep still counts what it claims to
        run: bash scripts/tests/audit-sweep-test.sh
      # ── just status ──────────────────────────────────────────────────────
      # The release block answers whether a cut is due (#1639), and both of its
      # GitHub reads can fail in ways a reader cannot see: an outage that
      # printed an empty section would read as "no release in flight".
      - name: just status still reports the release burn
        run: bash scripts/tests/status-release-test.sh
      # ── agent tooling self-tests ─────────────────────────────────────────
      # The claim tooling is what stops one issue being built twice (#1702).
      - name: just claim still refuses a claimed issue
        run: bash scripts/tests/claim-issue-test.sh
      - name: just pr-open still refuses an unclaimed issue
        run: bash scripts/tests/pr-open-test.sh
      - name: The session claims list still reads in-flight issues
        run: bash scripts/tests/session-claims-test.sh
      - name: just status still shows each epic's next child
        run: bash scripts/tests/status-epics-test.sh
      - name: just epic-add still attaches sub-issues
        run: bash scripts/tests/epic-add-test.sh
      - name: The handover opener still carries its facts
        run: bash scripts/tests/handover-test.sh
      # ── cargo-deny ─────────────────────────────────────────────────────
      # Replaces cargo-audit. Checks advisories (same RustSec DB), license
      # compliance, crate bans, and source restrictions in one pass.
      # Config: deny.toml. Ignore list migrated from .cargo/audit.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
      # ── Gitleaks ───────────────────────────────────────────────────────
      # Scans for leaked secrets (API keys, tokens, credentials) in the
      # diff. ~150 built-in regex patterns, runs in seconds.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only signal for a red run on main: PR failures are already visible on the
  # PR, so this is scoped to push events on main (#1554). gh + GITHUB_TOKEN is
  # the zero-dependency option here: no webhook secret to provision. Comments
  # on an existing open ci-red-main issue instead of opening a second so a run
  # of back-to-back red pushes doesn't spam the tracker.
  alert-on-red-main:
    name: Alert on red main
    runs-on: ubuntu-latest
    needs: [changes, test, msrv, clippy, native-ios, snapshot-hygiene, fmt, security]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      issues: write
    steps:
      - name: File or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-red-main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Another push to main failed CI: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CI failed on main" \
              --body "A push to main failed CI: $RUN_URL" \
              --label ci-red-main \
              --assignee jonyardley
          fi
