name: Release, Play internal testing

# Signed release bundle to Play's internal testing track (#2499), on the same
# tags as release-testflight.yml. Ubuntu, so not 10x-billed like the iOS build.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Play (off for the bootstrap bundle uploaded by hand)"
        type: boolean
        default: true
      release_status:
        description: "completed, or draft while the app has never been rolled out"
        type: choice
        options: [completed, draft]
        default: completed
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"

jobs:
  play:
    name: Build + upload to Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Before the checkout and the build: an unsigned bundle is refused by Play,
      # and one without Sentry reports nothing (#2497).
      - name: Require the signing and Sentry secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
          UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          missing=()
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "$UPLOAD" = "true" ] && [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. Set each with: gh secret set <name>"
            exit 1
          fi
          case "${SENTRY_DSN_ANDROID:-}" in
            *[[:space:]]*)
              echo "::error::SENTRY_DSN_ANDROID carries whitespace. Re-set it with: printf %s '<dsn>' | gh secret set SENTRY_DSN_ANDROID"
              exit 1
              ;;
            https://*)
              echo "Sentry DSN present: this build will report crashes."
              ;;
            *)
              if [ "${{ github.event_name }}" = "push" ]; then
                echo "::error::SENTRY_DSN_ANDROID is unset or is not an https DSN, so this build would ship with Sentry off. Set it with: gh secret set SENTRY_DSN_ANDROID"
                exit 1
              fi
              echo "::warning::SENTRY_DSN_ANDROID is unset, so this build reports nothing."
              ;;
          esac
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "release-play"
          cache-on-failure: true
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: just,cargo-ndk@4.1.2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install the SDK platform and NDK
        run: |
          ndk=$(sed -n 's/^intrada\.ndkVersion=//p' android/gradle.properties)
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;${ndk}"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Release core: debug cores are 10 to 100 times slower in hot paths.
      - name: Generate the Kotlin bindings and native libraries (release core)
        run: just android-gen release
      - name: Build the signed release bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # Tag without its v; on a branch dispatch Gradle reads ios/project.yml (#1961).
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          ANDROID_VERSION_NAME="${ANDROID_VERSION_NAME#v}"
          [ -n "$ANDROID_VERSION_NAME" ] || unset ANDROID_VERSION_NAME
          export ANDROID_VERSION_NAME
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ANDROID_UPLOAD_KEYSTORE"' EXIT
          printf %s "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$ANDROID_UPLOAD_KEYSTORE"
          # The signing passwords are read while Gradle configures, so keep them out of the saved cache.
          ./gradlew --no-configuration-cache :app:bundleRelease
          ls -l app/build/outputs/bundle/release/
      - name: Upload the bundle as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: intrada-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error
      - uses: ruby/setup-ruby@v1
        if: github.event_name == 'push' || inputs.upload
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Upload to Play internal testing
        if: github.event_name == 'push' || inputs.upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # A tag takes the repo variable, set to draft until the first rollout from the Console.
          PLAY_RELEASE_STATUS: ${{ inputs.release_status || vars.PLAY_RELEASE_STATUS || 'completed' }}
          ANDROID_AAB: android/app/build/outputs/bundle/release/app-release.aab
        run: bundle exec fastlane android internal
