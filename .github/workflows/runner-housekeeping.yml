name: Runner housekeeping

# The self-hosted Mac keeps its workspace between runs, which is where most of
# the gate's speed comes from (#1577): warm `target/`, DerivedData and resolved
# SwiftPM sources. The gate drops its own test result bundles at the start of
# each run and drops extra simulators and runtimes at the end (#2983), so what
# is left to grow here is xcodebuild's build logs, the compilation cache and
# the six test simulators.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    name: Prune the self-hosted runner workspace
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # An unset RUNNER_WORKSPACE would leave the globs below matching from
      # the filesystem root, so fail rather than tidy the wrong tree.
      - name: Space and workspace sizes before
        run: |
          set -euo pipefail
          test -n "${RUNNER_WORKSPACE:-}"
          df -h /System/Volumes/Data | tail -1
          du -sh "$RUNNER_WORKSPACE"/*/ios/build "$RUNNER_WORKSPACE"/*/target "$RUNNER_WORKSPACE"/*/.xcode-cache 2>/dev/null || true
      - name: Drop xcodebuild logs
        run: |
          set -euo pipefail
          test -n "${RUNNER_WORKSPACE:-}"
          rm -rf "$RUNNER_WORKSPACE"/*/ios/build/dd/Logs
          rm -rf "$RUNNER_WORKSPACE"/*/ios/build/dd-release/Logs
      # The compilation cache (#2926) is one content-addressed store, so it goes
      # whole once past 10 GB rather than file by file; the next build refills it.
      - name: Drop an oversized Xcode compilation cache
        run: |
          set -euo pipefail
          test -n "${RUNNER_WORKSPACE:-}"
          for dir in "$RUNNER_WORKSPACE"/*/.xcode-cache; do
            [ -d "$dir" ] || continue
            kb="$(du -sk "$dir" | cut -f1)"
            [ "$kb" -le $((10 * 1024 * 1024)) ] || rm -rf "$dir"
          done
      # Only removes devices whose runtime is already gone, so it cannot take
      # the gate's device while the iOS 26.5 runtime is still installed. If an
      # Xcode update drops that runtime this would take it too, but the gate's
      # own toolchain assertion has already failed by then.
      - name: Drop simulator devices with no runtime
        run: xcrun simctl delete unavailable
      # The six test devices grow to 5 to 6 GB each (#2983). Weekly, not per
      # run: booting them fresh is the wait the gate avoids (#2269). Inline,
      # since this job has no checkout: one would share the gate's warm folder.
      - name: Erase the test simulators
        run: |
          set -euo pipefail
          xcrun simctl list devices --json \
            | python3 -c "import json,sys; [print(d['udid']) for v in json.load(sys.stdin)['devices'].values() for d in v if d['name'].startswith('intrada-test-')]" \
            | while read -r udid; do
                echo "erasing test simulator $udid"
                xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
                xcrun simctl erase "$udid"
              done
      # The gate adds one small record per green tree (#2113); a month-old
      # tree will not be merged again.
      - name: Drop green-tree records older than 30 days
        run: |
          set -euo pipefail
          dir="$HOME/.intrada-ci/green-trees"
          [ ! -d "$dir" ] || find "$dir" -type f -mtime +30 -delete
      - name: Space after
        run: df -h /System/Volumes/Data | tail -1
