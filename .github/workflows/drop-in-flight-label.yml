name: Drop in-flight label

# `just status` reads GitHub, so a stale `in-flight` label makes its output lie
# about what is being worked on. CLAUDE.md asks for the label to be dropped when
# the PR merges or closes; this does it rather than relying on anyone remembering.
on:
  pull_request:
    types: [closed]

jobs:
  drop:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Only issues this PR actually closes, never every issue its body
            // happens to mention: a PR routinely cites related work that is
            // still legitimately in flight.
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) { nodes { number } }
                  }
                }
              }`;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.pull_request.number,
            });
            const issues =
              result.repository.pullRequest.closingIssuesReferences.nodes.map((n) => n.number);
            if (issues.length === 0) {
              core.info("no closing issue references; nothing to do");
              return;
            }
            for (const number of issues) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: number,
                  name: "in-flight",
                });
                core.info(`removed in-flight from #${number}`);
              } catch (error) {
                // 404 is the label not being there, which is the normal case.
                if (error.status !== 404) throw error;
                core.info(`#${number} carried no in-flight label`);
              }
            }
