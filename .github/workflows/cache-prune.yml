# GitHub evicts by LRU once a repo's Actions cache passes 10 GB, which silently
# drops the 928 MB SwiftPM cache and the newest DerivedData entries and turns a
# warm iOS build cold. Pruning per key family keeps the hot entries resident.
name: Cache Prune

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    name: Cache Prune
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prune cache families
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api="repos/${{ github.repository }}/actions/caches"
          work="$(mktemp -d)"
          all="$work/all.tsv"
          tab="$(printf '\t')"

          default_ref="refs/heads/$(gh api "repos/${{ github.repository }}" --jq .default_branch)"

          gh api --paginate "$api?per_page=100" \
            --jq '.actions_caches[] | [.id, .created_at, .size_in_bytes, .ref, .key] | @tsv' \
            > "$all"

          gb() { awk -v b="$1" 'BEGIN { printf "%.2f", b / 1000000000 }'; }
          total() { awk -F'\t' '{ s += $3 } END { print s + 0 }' "$1"; }

          before="$(total "$all")"
          echo "Before: $(wc -l < "$all" | tr -d ' ') entries, ${before} bytes ($(gb "$before") GB); default ref ${default_ref}"

          reclaimed=0
          deleted=0
          failed=0

          prune_family() {
            local prefix="$1" keep="$2" exclude="${3:-}"
            local ranked="$work/ranked.tsv" surplus="$work/surplus.tsv"

            # A cache is restorable from its own ref or the default branch only, and a
            # restore resolves to the newest matching key, so exactly one entry needs a
            # guaranteed slot: the newest default-branch one, which every PR can reuse.
            # Older default-branch copies are dead weight, so age decides the rest.
            awk -F'\t' -v p="$prefix" -v x="$exclude" '
              index($5, p) == 1 && (x == "" || index($5, x) != 1)
            ' "$all" \
              | sort -t "$tab" -k2,2r \
              | awk -F'\t' -v d="$default_ref" '
                  {
                    rank = 1
                    if (!seen && $4 == d) { rank = 0; seen = 1 }
                    print rank "\t" $0
                  }
                ' \
              | sort -t "$tab" -k1,1n -k3,3r \
              | cut -f2- \
              > "$ranked"

            tail -n "+$((keep + 1))" "$ranked" > "$surplus"

            local count
            count="$(wc -l < "$surplus" | tr -d ' ')"
            echo "  $prefix: $(wc -l < "$ranked" | tr -d ' ') entries, keeping $(head -n "$keep" "$ranked" | cut -f1 | tr '\n' ' ')"
            if [ "$count" -eq 0 ]; then
              return 0
            fi

            local id created size ref key
            while IFS="$tab" read -r id created size ref key; do
              if gh api -X DELETE "$api/$id" --silent 2>"$work/err"; then
                echo "    deleted $id ($size bytes, $ref) $key"
                reclaimed=$((reclaimed + size))
                deleted=$((deleted + 1))
              elif grep -q "HTTP 404" "$work/err"; then
                # A concurrent run evicted it first, which is the outcome we wanted.
                echo "    gone already $id $key"
              else
                echo "::warning::could not delete cache $id ($key): $(tr '\n' ' ' < "$work/err")"
                failed=$((failed + 1))
              fi
            done < "$surplus"
          }

          # A subfamily lives under its parent's prefix, so it is matched first and
          # excluded from the parent bucket: neither can starve the other.
          prune_family "ios-dd-release-" 3
          prune_family "ios-dd-" 3 "ios-dd-release-"
          prune_family "ios-spm-" 2
          prune_family "ios-bindings-" 3
          # rust-cache never deletes its own entries either, it just relies on
          # the same LRU: prefix restore plus the guaranteed default-branch
          # slot keeps pull requests warm on two.
          prune_family "native-ios-" 2
          prune_family "native-" 2 "native-ios-"
          prune_family "clippy-" 2
          prune_family "coverage-" 2
          prune_family "msrv-" 2
          prune_family "release-testflight-" 2

          # The tool caches (cargo-swift-, xcodegen-, gitleaks-, setup-ruby-)
          # are a few MB each and one entry per family, so they are left alone.

          fresh="$work/after.tsv"
          gh api --paginate "$api?per_page=100" \
            --jq '.actions_caches[] | [.id, .created_at, .size_in_bytes, .ref, .key] | @tsv' \
            > "$fresh"
          after="$(total "$fresh")"

          echo "After: $(wc -l < "$fresh" | tr -d ' ') entries, ${after} bytes ($(gb "$after") GB); deleted ${deleted}, reclaimed ${reclaimed} bytes ($(gb "$reclaimed") GB)"

          # Nobody reads a green scheduled job, and this one is what holds the
          # repo under the ceiling, so a delete that failed for any reason
          # other than being gone already has to be loud.
          [ "$failed" -eq 0 ] || { echo "✗ ${failed} cache deletes failed" >&2; exit 1; }
