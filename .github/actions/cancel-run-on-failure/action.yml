name: Cancel run on failure
description: >
  Cancel the whole run when a fast gate fails, so the pending macos-26 jobs (a
  40-minute build plus three 20-to-30-minute test jobs) stop burning minutes on
  a run that is already red. GitHub has no native equivalent outside a matrix's
  fail-fast. Note the run then reports as cancelled rather than failed: the
  failing job keeps its own logs, but the PR shows grey instead of red.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
