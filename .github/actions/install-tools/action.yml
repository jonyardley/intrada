name: Install tools
description: >-
  Restore pinned cargo tools from the Actions cache, and download them with
  taiki-e/install-action only on a miss, so an outage of GitHub's release
  downloads cannot fail a job whose tools are already cached (#2778).

# The key hashes this file, so a change to a version or to the install-action
# pin below starts a fresh entry. Only the named binaries in $CARGO_HOME/bin
# are cached, never the directory, which also holds rustup's proxies (#2778).

inputs:
  tools:
    description: Comma separated tools with versions, as install-action takes them
    required: true

runs:
  using: composite
  steps:
    - name: Plan the tool cache
      id: plan
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        # Callers on the macOS image add this themselves; a future one may not.
        echo "$bin" >> "$GITHUB_PATH"
        IFS=', ' read -r -a specs <<< "$TOOLS"
        if [ "${#specs[@]}" -eq 0 ]; then
          echo "::error::install-tools needs at least one tool"
          exit 1
        fi
        names=()
        paths=()
        for spec in "${specs[@]}"; do
          [ -n "$spec" ] || continue
          if [ "${spec#*@}" = "$spec" ]; then
            echo "::error::$spec has no version, so the cache key would not name it"
            exit 1
          fi
          names+=("${spec%%@*}")
          paths+=("$bin/${spec%%@*}")
        done
        # A cache key cannot hold a comma.
        list=$(printf '%s_' "${specs[@]}")
        {
          echo "bin=$bin"
          echo "names=${names[*]}"
          echo "list=${list%_}"
          echo "paths<<EOF"
          printf '%s\n' "${paths[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    # No restore-keys: a partial match would skip the install with binaries
    # of other versions.
    - name: Restore the tools
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.list }}-${{ hashFiles('.github/actions/install-tools/action.yml') }}
    - name: Download the tools (cache miss)
      if: steps.restore.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@v2.90.1
      with:
        tool: ${{ inputs.tools }}
    # Where cargo does not run from $CARGO_HOME/bin (Homebrew's, on the macOS
    # image), install-action uses its own folder; copy to where the cache looks (#2778).
    - name: Gather every tool where the cache looks
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        BIN: ${{ steps.plan.outputs.bin }}
        NAMES: ${{ steps.plan.outputs.names }}
      run: |
        set -euo pipefail
        mkdir -p "$BIN"
        missing=0
        for name in $NAMES; do
          if src=$(command -v "$name"); then
            [ "$src" = "$BIN/$name" ] || cp "$src" "$BIN/$name"
          else
            echo "::error::$name was not installed, so the tool cache cannot hold it"
            missing=1
          fi
        done
        exit "$missing"
    # Saved here rather than in a post step, so a job that fails later still
    # fills the cache from the one run where the download worked.
    - name: Save the tools
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
