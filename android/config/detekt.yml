# Builds on detekt's defaults; .claude/rules/android-quality.md names the patterns banned here.
potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  LateinitUsage:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # Test fixtures take one defaulted argument per field (CLAUDE.md, Testing).
    ignoreDefaultParameters: true

exceptions:
  TooGenericExceptionCaught:
    # The bridge and the disk job turn any failure into an answer the core reads, never a crash.
    active: false

style:
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'androidx.compose.material.*'
        reason: 'intrada draws its own look on Compose foundation, not Material.'
      - value: 'androidx.compose.material3.*'
        reason: 'intrada draws its own look on Compose foundation, not Material.'

Compose:
  ComposableAnnotationNaming:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MutableParams:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  RememberMissing:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
