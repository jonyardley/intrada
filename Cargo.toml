[workspace]
# Active build = the native iOS stack (core + ffi) and the API. The Leptos web
# shell and the Tauri shell were removed (see docs/rebuild-review.md); the
# native SwiftUI app on the Crux core is the only shell going forward.
members = [
  "crates/intrada-core",
  "crates/intrada-ffi",
  "crates/intrada-api",
]
resolver = "2"
# Set by crux_core 0.20, which declares rust-version 1.90 (rust-toolchain.toml
# already pins it). intrada-api keeps its own lower floor: it has no crux.
package.rust-version = "1.90"

[workspace.dependencies]
crux_core = "0.20.0"
crux_http = "0.20.0" # tracks crux_core: a capability on 0.19 pulls in a second, incompatible crux_core
# Pinned exactly because crux_core 0.20's facet_generate 0.19 pins it too —
# two facet versions in one tree surface as `Facet<'_> is not satisfied`
# rather than a version conflict.
facet = "=0.46.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# Reads the authored content (content/gates.toml) at startup. `parse` only:
# the engine never writes TOML back.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.dev.package."*"]
debug = false

[profile.dev]
debug = "line-tables-only"
