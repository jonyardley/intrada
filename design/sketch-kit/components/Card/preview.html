<!-- @dsCard group="Surfaces" height=200 -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: var(--spacing-card); background: var(--paperTop); color: var(--ink); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement, I = window.Intrada;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h("div", { style: { display: "grid", gap: "var(--spacing-card)" } },
    h(I.Card, null, h("div", { className: "cardTitle" }, "Card with lift")),
    h(I.Card, { lift: false }, h("div", { className: "cardTitle" }, "Card without lift, inside something lifted")))
  );
</script>
</body>
</html>
