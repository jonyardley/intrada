<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: var(--spacing-card); background: var(--paperTop); color: var(--ink); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement, I = window.Intrada;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h("div", { style: { display: "grid", gap: "var(--spacing-card)" } },
    h(I.MarkerButton, { label: "Start session · 10 min", glyph: "play" }),
    h(I.MarkerButton, { label: "Continue", glyph: "arrow", marker: "mint" }))
  );
</script>
</body>
</html>
