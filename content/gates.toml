# The paper teacher as data: the graph the planner walks, the drills it
# prescribes, and the gate criteria that say when a drill is done.
# Every number is a day-one guess; the gate-attempt log (logs.md) is what
# calibrates them. Read by `intrada-core`'s engine at startup (#1180), so a
# dangling node or gate reference here fails the parse rather than going
# quietly missing.
#
# Timing is always consistency/trend, never absolute deviation (decision 6).
# "clean" = zero wrong notes + timing consistent within the rep.
# Recognised optional gate fields: per_key, consecutive, keys_required,
# keys_chained_min, first_attempt, max_think_bars, max_listens,
# self_confirmed, self_rating_logged.

schema_version = "0.2"

[defaults]
clean_max_wrong_notes = 0
clean_timing = "consistent"      # variance-based; a stable lay-back is style, not error
time_ceiling_min = 6             # no block spirals past this
# The two axes "paper" used to conflate (spec §9.6). Phase 0 has no sensor at
# all, and the user judges the rep: (none, tap-verdict).
transport = "none"
judge = "tap-verdict"
session_minutes = 20             # the session length a plan is cut to fit
# The phrase a rep runs, where nobody has stated one. A guess like the mastery
# seeds, corrected from the log rather than trusted.
bars = 8
beats_per_bar = 4
count_in_beats = 4

# Sparse-click ladder: gate levels *within* click-always (decision 2).
[click_levels]
l1 = "click on every beat"
l2 = "click on 2 and 4"
l3 = "click on beat 1 of each bar"
l4 = "click on beat 1 of every other bar"

# What each input path may honestly claim (decision 7). Phase 0 has none of
# them, which is why its judge is the user's tap.
[transport_tiers]
wired = ["note-accuracy", "timing-consistency", "tempo-drift", "swing-report"]
bluetooth = ["note-accuracy", "swing-report", "trend"]
mic = ["timing-consistency", "trend"]
none = []

# Feedback cadence by drill maturity (feedback choreography; guidance
# hypothesis). Fade-out is data, not code.
[feedback]
new_drill = "verdict every rep"
solid_drill = "summary every 3 reps"
mature_drill = "predict-then-reveal"
single_failure = "cross plus one fact, nothing else"

[escalation]
consecutive_fail_trigger = 3
ladder = ["tempo-down", "shrink-scope", "change-mode", "swap-drill"]
name_the_wall_max_times = 1      # the second encouragement is a nag
tempo_down_pct = 20              # what the first rung drops the tempo by
tempo_floor_bpm = 40             # below this a drop is not practice
gate_open_hold_s = 2             # how long the open gate is left on screen

[planner]
# A node at or above this seeded estimate is maintenance rather than
# acquisition: shorter passes, and the material a session warms up on
# (spec §5 stage 3). Live mastery replaces the seed at #1148.
maintenance_estimate = 0.6
acquisition_minutes = 6          # low evidence wants one longer uninterrupted block,
                                 # and time_ceiling_min is the hard stop above it
maintenance_minutes = 4          # matured material wants a shorter pass
grind_max_minutes_per_session = 10
grind_max_blocks = 1

# The declared destination and its target set (content/intent.md). The planner
# back-chains a route from these; it never reads a route.
[intent]
goal = "Improvise confidently over jazz standards"
campaign = "Restricted improv over Strasbourg / St. Denis"
destination = "Strasbourg / St. Denis"
targets = [
  "chord-tone-targeting",
  "rootless-under-melody",         # the target names the rung it wants
  "phrase-transposition",
  "tune-form-memory",
]
# Countable-unmatched targets become user nodes and matched ones user drills
# (decision 19); only the genuinely unmeasurable stays here, unscored.
opaque_targets = ["Make the last A section sing"]

# Per-session scheduling quotas. Not gates: there is no pass or fail in a
# traversal, so it cannot be a `Requirement` (spec §9.5).
[traversal.rootless-a-b]
goal = "2-3 new keys at the current rung, plus a maintenance pass on all landed keys"
new_keys_per_session_min = 2
new_keys_per_session_max = 3

# ── The graph (content/nodes.md is the prose; the mastery seeds live here,
#    because a seed the engine cannot read is a seed that drifts) ──

[nodes.shells-ii-v-i]
title = "Shell voicings"
circle = "hands"
mode = "keys"
prerequisites = ["diatonic-7ths"]
drills = [
  "shells-cycle",
  "shells-under-melody",
  "shells-random-key",
]
mastery_estimate = 0.7
mastery_band = "medium"

[nodes.rootless-a-b]
title = "Rootless voicings"
circle = "hands"
mode = "keys"
prerequisites = ["shells-ii-v-i"]
drills = [
  "rootless-one-key",
  "rootless-transition",
  "rootless-under-melody",
  "rootless-cycle",
]
mastery_estimate = 0.3
mastery_band = "low"
grind = true                     # honest label: the middle keys are grind

[nodes.phrase-transposition]
title = "Phrase transposition"
circle = "bridge"
mode = "keys-to-away"
prerequisites = ["micro-transcription", "swing-click-time"]
drills = [
  "phrase-home-key",
  "phrase-nearby-keys",
  "phrase-cycle",
  "phrase-random-key",
]
mastery_estimate = 0.4
mastery_band = "low"

[nodes.chord-tone-targeting]
title = "Chord-tone targeting"
circle = "bridge"
mode = "keys"
prerequisites = ["shells-ii-v-i", "swing-click-time"]
drills = [
  "targeting-skeleton",
  "targeting-approach",
  "targeting-full-form",
]
mastery_estimate = 0.35
mastery_band = "low"

[nodes.micro-transcription]
title = "Micro-transcription"
circle = "head"
mode = "keys-to-away"
prerequisites = []
drills = [
  "transcription-entry",
  "transcription-sing",
  "transcription-audiation",
]
mastery_estimate = 0.4
mastery_band = "low"

# Stubs. Named so gates, whys and prerequisites can reference them; a stub has
# no drills, so back-chaining through one yields no block rather than a
# guessed one.
[nodes.diatonic-7ths]
title = "Diatonic 7ths"
circle = "hands"
mode = "keys"
stub = true

[nodes.swing-click-time]
title = "Swing and click time"
circle = "hands"
mode = "keys"
stub = true

[nodes.rhythm-vocabulary]
title = "Rhythm vocabulary"
circle = "bridge"
mode = "keys"
stub = true

[nodes.interval-recognition]
title = "Interval recognition"
circle = "head"
mode = "away"
stub = true

[nodes.guide-tone-lines]
title = "Guide-tone lines"
circle = "bridge"
mode = "keys"
stub = true

[nodes.device-generate-ladder]
title = "Device generation"
circle = "bridge"
mode = "keys"
stub = true

[nodes.comping-rhythms]
title = "Comping rhythms"
circle = "hands"
mode = "keys"
stub = true

[nodes.upper-structures]
title = "Upper structures"
circle = "hands"
mode = "keys"
stub = true

[nodes.listening-assignments]
title = "Listening assignments"
circle = "head"
mode = "away"
