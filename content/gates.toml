# ── The drills (nodes.md's tables, in the order the ladder runs). `applied`
#    marks a drill parameterised by real music: the template needs at least
#    one, and closes on one (spec §5 stage 5) ──

[drills.shells-cycle]
gate = "shells-cycle"

[drills.shells-under-melody]
gate = "shells-under-melody"
section = "A section"
destination = "Strasbourg / St. Denis"
applied = true

[drills.shells-random-key]
gate = "shells-random-key"

[drills.rootless-one-key]
gate = "rootless-one-key"
section = "one key, LH alone"
bars = 3                         # a bar on each chord of the ii-V-I

[drills.rootless-transition]
gate = "rootless-transition"
section = "the change, not the chords"
bars = 2                         # the looped two-chord change

[drills.rootless-under-melody]
gate = "rootless-under-melody"
section = "A section"
destination = "Strasbourg / St. Denis"
applied = true

[drills.rootless-cycle]
gate = "rootless-cycle"

[drills.phrase-home-key]
gate = "phrase-home-key"
section = "home key"
minutes = 4                      # p001 advances a couple of keys a session,
                                 # not a block's worth (content/intent.md)

[drills.phrase-nearby-keys]
gate = "phrase-nearby-keys"
section = "whole-step neighbours"
minutes = 4

[drills.phrase-cycle]
gate = "phrase-cycle"
section = "cycle chain"
minutes = 4

[drills.phrase-random-key]
gate = "phrase-random-key"
section = "dealt key"
minutes = 4

[drills.targeting-skeleton]
gate = "targeting-skeleton"
section = "guide-tone skeleton"
destination = "Strasbourg / St. Denis"

[drills.targeting-approach]
gate = "targeting-approach"
section = "approach and land"
bars = 2                         # two-bar cells

[drills.targeting-full-form]
gate = "targeting-full-form"
section = "full form"
destination = "Strasbourg / St. Denis"
applied = true

[drills.transcription-entry]
gate = "transcription-entry"
section = "entry rung"

[drills.transcription-sing]
gate = "transcription-sing"
section = "sing first"

[drills.transcription-audiation]
gate = "transcription-audiation"
section = "audiation rung"

# ── The gates. The requirement is a closed enum on the Rust side, resolved
#    from these fields in one order: judge "self-confirmed" gives a
#    self-confirmed requirement, then keys_chained_min a chained one, then
#    keys_required a key-coverage one, then clean_passes a counted one. A gate
#    that matches none of them fails to parse, which is the whole gain over a
#    flat bag of optional fields (spec §8) ──

[gates.shells-cycle]
node = "shells-ii-v-i"
criterion = "ii-V-I shells through the full cycle of fourths, no stops"
clean_passes = 1
tempo_bpm = 100
click_level = "l2"

[gates.shells-under-melody]
node = "shells-ii-v-i"
criterion = "Strasbourg A section, melody over shells, hands together"
clean_passes = 3
tempo_bpm = 90
click_level = "l1"

[gates.shells-random-key]
node = "shells-ii-v-i"
criterion = "shuffled key cards: ii-V-I shells cold, within one bar of thinking time"
keys_required = 12
tempo_bpm = 80
click_level = "l1"

[gates.rootless-one-key]
node = "rootless-a-b"
criterion = "ii-V-I, A/B forms alternating, LH alone, one bar per chord"
# keys_required with clean_passes is the per-key reading: 3 clean in each key,
# and the traversal quota decides how many of them a session touches.
keys_required = 12
clean_passes = 3
tempo_bpm = 60
click_level = "l1"

[gates.rootless-transition]
node = "rootless-a-b"
criterion = "looped two-chord change (ii to V, then V to I), no gap at the change"
keys_required = 12
clean_passes = 4
tempo_bpm = 60
click_level = "l1"

[gates.rootless-under-melody]
node = "rootless-a-b"
criterion = "Strasbourg A section, melody over rootless LH"
clean_passes = 2
tempo_bpm = 80
click_level = "l1"

[gates.rootless-cycle]
node = "rootless-a-b"
criterion = "full cycle of fourths, A/B alternating, no stops"
clean_passes = 1
tempo_bpm = 80
click_level = "l1"

# ── phrase-transposition (parameterised by the in-flight phrase) ──

[gates.phrase-home-key]
node = "phrase-transposition"
criterion = "phrase over its ii-V-I loop in the home key"
clean_passes = 3
tempo_bpm = 120                  # p001 target tempo
click_level = "l2"

[gates.phrase-nearby-keys]
node = "phrase-transposition"
criterion = "clean in both whole-step neighbours, resolution lands on beat 1"
keys_required = 2
clean_passes = 2
tempo_bpm = 90
click_level = "l1"

[gates.phrase-cycle]
node = "phrase-transposition"
criterion = "phrase chained through 4+ consecutive cycle keys, ii-V links, no stops"
keys_chained_min = 4
tempo_bpm = 90
click_level = "l1"

[gates.phrase-random-key]
node = "phrase-transposition"
criterion = "dealt key, one count-in, clean first attempt"
keys_required = 12
first_attempt = true
tempo_bpm = 100
click_level = "l2"

# ── chord-tone-targeting ──

[gates.targeting-skeleton]
node = "chord-tone-targeting"
criterion = "whole-note guide-tone line, full form, 3rds/7ths connected by step"
clean_passes = 2
tempo_bpm = 90
click_level = "l1"

[gates.targeting-approach]
node = "chord-tone-targeting"
criterion = "two-bar cells: free bar, then target chord tone on beat 1 of the change"
clean_passes = 4
consecutive = true
tempo_bpm = 90
click_level = "l1"

[gates.targeting-full-form]
node = "chord-tone-targeting"
criterion = "full form: 3rd or 7th on beat 1 of every change; feel self-rated alongside, not gated"
clean_passes = 2
consecutive = true
tempo_bpm = 100
click_level = "l2"

# ── micro-transcription (no sensor can judge these, so the user does, and a
#    self-confirmed pass may never unlock a prerequisite: decisions 3 and 13) ──

[gates.transcription-entry]
node = "micro-transcription"
criterion = "1-2 bar phrase matched at the keys within 5 listens"
judge = "self-confirmed"
max_listens = 5

[gates.transcription-sing]
node = "micro-transcription"
criterion = "phrase sung (contour + rhythm) before touching the keys"
judge = "self-confirmed"

[gates.transcription-audiation]
node = "micro-transcription"
criterion = "phrase worked out fully away from the piano; first attempt at the keys matches"
judge = "self-confirmed"
first_attempt = true
