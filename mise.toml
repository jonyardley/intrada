# Dev toolchain, pinned in one place. Run `mise install` after cloning (SETUP.md §7).
# Rust itself stays with rustup.
[tools]
just = "1"
xcodegen = "2"
oxipng = "10"
# fastlane (TestFlight lane) needs Ruby >= 3; system Ruby 2.6 is too old.
ruby = "3.4"
"cargo:cargo-nextest" = "0.9"
# Hygiene gates (just hygiene / CI Security & hygiene job). Keep the typos
# pin in lockstep with ci.yml: dictionary updates change what gets flagged.
typos = "1.48"
"cargo:cargo-shear" = "1.13"
# Workflow linting (just hygiene). A workflow's first real exercise is the merge
# that triggers it, so a schema or expression error otherwise surfaces there.
actionlint = "1.7"
# actionlint shellchecks every `run:` block when shellcheck is present, and the
# CI runner has it. Without this pin the local gate silently skips that half.
shellcheck = "0.11"
# Pinned exactly: cargo-swift 0.9.0's bundled uniffi-bindgen matches our
# uniffi 0.29.4 runtime contract (see justfile ios-package). Bump in lockstep.
"cargo:cargo-swift" = "0.9.0"
# Cross-checkout Rust build cache — measured ~30% faster `just check` in a
# fresh worktree with a warm cache (#1206). Provisioned for everyone, but
# only active if you opt in with RUSTC_WRAPPER=sccache — see SETUP.md §6.
sccache = "0.17"
